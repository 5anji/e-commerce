openapi: 3.0.3

info:
  title: E-commerce API
  description: |
    Local API for the Spring Boot e-commerce demo.

    All endpoints except `/api/auth/**` require a JWT:
    `Authorization: Bearer <token>`.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
    description: Register and log in to obtain a JWT
  - name: Products
    description: Product CRUD and category linking
  - name: Categories
    description: Category management

security:
  - bearerAuth: []

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: A user with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/products:
    get:
      tags: [Products]
      summary: List all products
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: A product with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/products/search:
    post:
      tags: [Products]
      summary: Search products by price, stock and category
      description: |
        All filters are optional; omitted filters are ignored and supplied
        filters are combined with AND. An empty body (`{}`) returns every product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSearchRequest'
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Invalid filter values or min/max ranges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Get a product by id
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags: [Products]
      summary: Partially update a product
      description: Only supplied fields are changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Product or category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: A product with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Products]
      summary: Delete a product
      responses:
        '204':
          description: Product deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/products/{id}/category:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [Products]
      summary: Link a category to a product
      description: Replaces the product's current category, if any.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryLinkRequest'
      responses:
        '200':
          description: Category linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Product or category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Products]
      summary: Unlink the category from a product
      responses:
        '200':
          description: Category unlinked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/categories:
    get:
      tags: [Categories]
      summary: List all categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [Categories]
      summary: Get a category by id
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [Categories]
      summary: Delete a category
      description: Fails with 409 while any product still uses the category.
      responses:
        '204':
          description: Category deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Category is still linked to products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by `/api/auth/login` or `/api/auth/register`.

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product id
      schema:
        type: integer
        format: int64
        example: 1
    CategoryId:
      name: id
      in: path
      required: true
      description: Category id
      schema:
        type: integer
        format: int64
        example: 1

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          minLength: 6
          example: secret123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          example: secret123

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        tokenType:
          type: string
          example: Bearer
        userId:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: test@example.com
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER

    ProductRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          maxLength: 150
          example: Mechanical Keyboard
        description:
          type: string
          nullable: true
          example: Hot-swappable, 75% layout
        price:
          type: number
          format: double
          minimum: 0
          example: 89.99
        stock:
          type: integer
          minimum: 0
          default: 0
          example: 25
        categoryId:
          type: integer
          format: int64
          nullable: true
          example: 1

    ProductUpdateRequest:
      type: object
      description: All fields optional; omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: Mechanical Keyboard
        description:
          type: string
          nullable: true
          example: Hot-swappable, 75% layout
        price:
          type: number
          format: double
          minimum: 0
          example: 79.99
        stock:
          type: integer
          minimum: 0
          example: 30
        categoryId:
          type: integer
          format: int64
          nullable: true
          example: 1

    ProductSearchRequest:
      type: object
      description: |
        Optional product filters. Omitted fields are ignored. All supplied
        filters are combined with AND.
      properties:
        minPrice:
          type: number
          format: double
          minimum: 0
          example: 10.00
        maxPrice:
          type: number
          format: double
          minimum: 0
          example: 100.00
        minStock:
          type: integer
          minimum: 0
          example: 1
        maxStock:
          type: integer
          minimum: 0
          example: 50
        categoryId:
          type: integer
          format: int64
          example: 1

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Mechanical Keyboard
        description:
          type: string
          nullable: true
          example: Hot-swappable, 75% layout
        price:
          type: number
          format: double
          example: 89.99
        stock:
          type: integer
          example: 25
        categoryId:
          type: integer
          format: int64
          nullable: true
          example: 1
        categoryName:
          type: string
          nullable: true
          example: Peripherals
        createdAt:
          type: string
          format: date-time
          example: '2026-11-06T10:15:30'

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: Peripherals

    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Peripherals

    CategoryLinkRequest:
      type: object
      required: [categoryId]
      properties:
        categoryId:
          type: integer
          format: int64
          example: 1

    ApiError:
      type: object
      description: Standard Spring error response.
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-11-06T10:15:30.123+00:00'
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        path:
          type: string
          example: /api/products/999
        message:
          type: string
          example: Product not found
